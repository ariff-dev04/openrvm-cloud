services:
  vendor-simulator:
    build:
      context: ./services/vendor-simulator
    container_name: openrvm_simulator
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8081:8081"
    networks:
      - openrvm_internal

  openrvm-api:
    build:
      context: ./services/openrvm-api
    container_name: openrvm_api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - openrvm_internal
      - homelab_ingress
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-cache:
        condition: service_started
      vendor-simulator:
        condition: service_started

  postgres-db:
    image: postgres:16-alpine
    container_name: openrvm_db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - openrvm_pgdata:/var/lib/postgresql/data
    networks:
      - openrvm_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-cache:
    image: redis:7-alpine
    container_name: openrvm_redis
    restart: unless-stopped
    networks:
      - openrvm_internal

  openrvm-ui:
    build:
      context: ./services/openrvm-ui
    container_name: openrvm_ui
    restart: unless-stopped
    ports:
      - "127.0.0.1:8085:80"
    networks:
      - openrvm_internal
      - homelab_ingress
    depends_on:
      - openrvm-api   

   # Permanent Public HTTPS Tunnel (URL never changes on server reboot!)
  ngrok-tunnel:
    image: ngrok/ngrok:alpine
    container_name: openrvm_ngrok
    restart: unless-stopped
    env_file:
      - .env
    command:
      - "http"
      - "http://openrvm-ui:80"
      - "--url=${NGROK_STATIC_DOMAIN}"
    networks:
      - openrvm_internal
    depends_on:
      - openrvm-ui    

  # Public HTTPS Zero-Trust Tunnel (Exposes openrvm-ui:80 without router port forwarding!)
  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: openrvm_tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://openrvm-ui:80
    networks:
      - openrvm_internal
    depends_on:
      - openrvm-ui

networks:
  openrvm_internal:
    driver: bridge
  homelab_ingress:
    external: true

volumes:
  openrvm_pgdata:
